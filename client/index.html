<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>わいわいバース</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #07091a;
        color: #e8ecff;
        height: 100vh;
        display: flex;
      }
      #stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
      }
      #world {
        width: min(100%, 960px);
        aspect-ratio: 960 / 640;
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        background: #0f1226;
      }
      #status { font-size: 13px; color: #9aa6d6; min-height: 18px; }
      #side {
        width: 320px;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        background: #0a0d20;
      }
      #side h1 { font-size: 15px; margin: 14px 16px 6px; letter-spacing: 0.04em; }
      #hint { font-size: 12px; color: #6f79a8; margin: 0 16px 8px; }
      #chatlog { flex: 1; overflow-y: auto; padding: 8px 16px; font-size: 13px; line-height: 1.5; }
      .msg { margin-bottom: 4px; word-break: break-word; }
      .who { font-weight: 600; }
      #chatinput {
        margin: 10px 16px 16px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #141833;
        color: #e8ecff;
        font-size: 14px;
        outline: none;
      }
      #chatinput:focus { border-color: #54a0ff; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="world"></canvas>
      <div id="status">起動中…</div>
    </div>
    <div id="side">
      <h1>わいわいバース</h1>
      <p id="hint">WASD / 矢印 / クリックで移動。下の欄でチャット。<br />名前変更は <code>/name あなたの名前</code></p>
      <div id="chatlog"></div>
      <input id="chatinput" placeholder="メッセージを入力して Enter…" maxlength="200" />
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
